schema_version: "1.1"
name: withdraw-prompt-count
expected_outcome: |
  docs/prompt-plan.md states that a withdrawal is one EIP-712 WithdrawCollateral, one Schnorr PSBT signature over every vault input in a single call, one EIP-191 envelope per vault input and one final EIP-191 envelope that hands the txid to Surge (3 + N for N inputs); that a renewal is one EIP-712 RequestCreditLineExtension, one Schnorr vault self-spend that pays a miner fee and one EIP-191 envelope per input (2 + N); that the resume flows repeat the Bitcoin and envelope legs without a new EIP-712; that relayer retries re-sign envelopes so the counts are a floor; and that the README under-counts.
